/* ============ MODEL ============ */
function seed(){ players=ROSTER.map(r=>({...r,games:[],available:true,estAvg:null,team:null,pin:false,target:null})); }
function merge(d){ const by=new Map((d.players||[]).map(p=>[p.no,p]));
  players=ROSTER.map(r=>{const s=by.get(r.no)||{};return {...r,games:s.games||[],available:s.available!==false,estAvg:(s.estAvg??null),team:(s.team??null),pin:!!s.pin,target:(s.target??null)};});
  if(d.settings) settings={...DEFSET,...d.settings}; if(d.matchday) matchday={A:{...(d.matchday.A||{})},B:{...(d.matchday.B||{})},C:{...(d.matchday.C||{})}};
  if(d.installId){const seen=localStorage.getItem('vox_install');if(seen&&seen!==d.installId){S.dataReset=true;try{render()}catch(e){}}try{localStorage.setItem('vox_install',d.installId)}catch(e){}} }
function cacheSave(){try{localStorage.setItem(CK,JSON.stringify({players,settings,matchday}))}catch(e){}}
function cacheLoad(){try{const d=JSON.parse(localStorage.getItem(CK));if(d&&d.players){players=d.players;settings={...DEFSET,...d.settings};matchday=d.matchday||{A:{},B:{},C:{}};return true}}catch(e){}return false}
function saveUI(){try{localStorage.setItem(UK,JSON.stringify(ui))}catch(e){}}
function loadUI(){try{const d=JSON.parse(localStorage.getItem(UK));if(d)ui={...ui,...d}}catch(e){}}
const P=no=>players.find(p=>p.no===+no);
const $=s=>document.querySelector(s);
function initials(n){const a=n.replace(/^(AR\.|ID\.|ER\.|Mr\.|Mrs\.|Ms\.)\s*/i,"").trim().split(/\s+/);return((a[0]||"")[0]||"")+((a[1]||"")[0]||"")}
function avatarBg(g){return g==="F"?"linear-gradient(135deg,#a869c2,#7d3c98)":"linear-gradient(135deg,#3b6ea5,#274d78)"}

/* ============ AVERAGES + STATS ============ */
function pstats(p){const g=p.games||[];let n=g.length,sum=0,high=0,strk=0,spr=0;g.forEach(x=>{sum+=+x.score||0;high=Math.max(high,+x.score||0);strk+=+x.strikes||0;spr+=+x.spares||0});return{n,sum,high,strk,spr}}
/* strike/spare rates + engagement (tie-breakers are strikes -> spares) */
function srate(p){const ps=pstats(p);return ps.n?ps.strk/ps.n:null}
function sprate(p){const ps=pstats(p);return ps.n?ps.spr/ps.n:null}
function lastLog(p){const g=p.games||[];if(!g.length)return null;let t=0;g.forEach(x=>{t=Math.max(t,+x.ts||0)});return t||null}
function daysAgo(ts){return ts?Math.floor((Date.now()-ts)/86400000):null}
function gamesInDays(p,d){const cut=Date.now()-d*86400000;return (p.games||[]).filter(x=>(+x.ts||0)>=cut).length}
function teamStrikes(L){return L.reduce((s,p)=>{const r=srate(p);return s+(r!=null?r:((p.lgStr&&p.lgM)?p.lgStr/p.lgM:0))},0)}
function teamSpares(L){return L.reduce((s,p)=>{const r=sprate(p);return s+(r!=null?r:0)},0)}
function eff(p){const pr=pstats(p),lgM=p.lgM||0,lg=p.lgAvg;let avg=null,src="none";
  if(lg!=null&&lgM>0&&pr.n>0){avg=(lg*lgM+pr.sum)/(lgM+pr.n);src="both"}
  else if(lg!=null&&lgM>0){avg=lg;src="league"}
  else if(pr.n>0){avg=pr.sum/pr.n;src="practice"}
  else if(p.estAvg!=null){avg=+p.estAvg;src="est"}
  return{avg:avg==null?null:Math.round(avg),src}}
/* ---- SEASON MODEL: S1 = prior average (last season), S2 = this-season practice avg ---- */
function seasonStats(p){const s1=(p.lgAvg!=null)?Math.round(p.lgAvg):null;const ps=pstats(p);const s2=ps.n>0?Math.round(ps.sum/ps.n):null;const delta=(s1!=null&&s2!=null)?(s2-s1):null;return{s1,s2,s2n:ps.n,delta};}
function deltaTag(delta){if(delta==null)return'';const c=delta>0?'var(--good)':(delta<0?'var(--bad)':'var(--muted)');const t=delta>0?('▲ +'+delta):(delta<0?('▼ '+delta):'±0');return`<span style="color:${c};font-weight:700">${t}</span>`;}
function seasonCardHTML(ss){const dc=ss.delta==null?'var(--muted)':(ss.delta>0?'var(--good)':(ss.delta<0?'var(--bad)':'var(--muted)'));const dt=ss.delta==null?'—':(ss.delta>0?('▲ +'+ss.delta):(ss.delta<0?('▼ '+ss.delta):'±0'));let cap;if(ss.s1==null&&ss.s2!=null)cap="New this season — keep logging to build a baseline for next year.";else if(ss.s1!=null&&ss.s2==null)cap="Last season you averaged "+ss.s1+". Log your first game to start this season.";else if(ss.s1!=null&&ss.s2!=null)cap=ss.delta>0?("You're up "+ss.delta+" on last season — keep it going."):(ss.delta<0?(Math.abs(ss.delta)+" below last season — your game plan below will help."):"Right on last season's pace.");else cap="Log a game to start tracking this season.";return `<div class="card" style="padding:16px 18px;margin-top:12px"><div style="font-size:12px;font-weight:700;color:var(--navy)">Season progress</div><div style="display:flex;align-items:center;gap:10px;margin-top:14px"><div style="flex:1;text-align:center"><div class="lbl">Last season</div><div class="num" style="font-size:25px;font-weight:700;color:var(--muted2);line-height:1.1">${ss.s1==null?'—':ss.s1}</div></div><div style="color:${dc};font-size:18px;font-weight:700">→</div><div style="flex:1;text-align:center"><div class="lbl">This season</div><div class="num" style="font-size:25px;font-weight:700;color:var(--navy);line-height:1.1">${ss.s2==null?'—':ss.s2}</div></div><div style="flex:1;text-align:center"><div class="lbl">Change</div><div class="num" style="font-size:17px;font-weight:700;color:${dc};line-height:1.1">${dt}</div></div></div><div style="font-size:11.5px;color:var(--muted2);margin-top:12px;line-height:1.45">${esc(cap)}</div></div>`;}
function setLbSort(s){S.lbSort=s;render();}
function squadLbHTML(){const sort=S.lbSort||'imp';const SS=players.map(p=>seasonStats(p));const w2=SS.filter(s=>s.s2!=null);const teamAvg=w2.length?Math.round(w2.reduce((a,s)=>a+s.s2,0)/w2.length):null;const both=SS.filter(s=>s.s1!=null&&s.s2!=null);const teamDelta=both.length?Math.round((both.reduce((a,s)=>a+s.s2,0)-both.reduce((a,s)=>a+s.s1,0))/both.length):null;const arr=players.map(p=>{const d=disp(p),ss=seasonStats(p);return{no:p.no,name:shortName(p.name),g:p.g,team:p.team,initials:initials(p.name),avg:d.avg,delta:ss.delta,isMe:p.no===ui.me};});arr.sort((a,b)=> sort==='imp' ? ((b.delta==null?-999:b.delta)-(a.delta==null?-999:a.delta)) : ((b.avg==null?-1:b.avg)-(a.avg==null?-1:a.avg)));const rows=arr.map((p,i)=>`<div style="display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:11px;background:${p.isMe?'#fdf6e3':'transparent'}"><div class="num" style="width:18px;text-align:center;font-size:12.5px;font-weight:800;color:${i<3?'#8a5a00':'var(--muted)'};flex:0 0 auto">${i+1}</div><div class="num" style="width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff;flex:0 0 auto;background:${avatarBg(p.g)}">${p.initials}</div><div style="min-width:0;flex:1"><div style="font-size:13px;font-weight:700;color:var(--navy)">${esc(p.name)}${p.isMe?' <span style="font-size:8.5px;font-weight:800;background:var(--gold);color:var(--navy);padding:1px 5px;border-radius:5px">YOU</span>':''}</div><div style="font-size:10px;color:var(--muted)">${p.team?'Sub-team '+p.team:'—'}</div></div><div style="text-align:right;flex:0 0 auto"><div class="num" style="font-size:16px;font-weight:700;color:var(--navy)">${p.avg==null?'—':p.avg}</div><div style="font-size:9px;font-weight:700">${p.delta!=null?deltaTag(p.delta):'<span style="color:var(--muted)">new bowler</span>'}</div></div></div>`).join('');const heroDelta=teamDelta==null?'':`<span style="font-size:12px;font-weight:700;color:${teamDelta>0?'#7bd88f':(teamDelta<0?'#ff9a8a':'#c6bfac')}">${teamDelta>0?'▲ +'+teamDelta:(teamDelta<0?'▼ '+teamDelta:'±0')} vs last season</span>`;return `<div style="background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:20px;padding:18px;color:#fff;margin-bottom:14px"><div class="lbl" style="color:#fff;opacity:.6">VOX STARS · this season</div><div style="display:flex;align-items:baseline;gap:10px;margin-top:4px"><div class="num" style="font-size:34px;font-weight:700;color:var(--gold2);line-height:1">${teamAvg==null?'—':teamAvg}</div>${heroDelta}</div><div style="font-size:11.5px;opacity:.72;margin-top:7px;line-height:1.4">Squad average — every game you log lifts it. We rise together.</div></div><div style="display:flex;align-items:center;gap:8px;margin:0 4px 8px"><div class="lbl">Who's rising</div><div style="display:flex;gap:6px;margin-left:auto">${['imp','avg'].map(k=>`<button onclick="setLbSort('${k}')" class="chip ${sort===k?'on':''}">${k==='imp'?'Most improved':'By average'}</button>`).join('')}</div></div><div class="card" style="padding:6px 14px">${rows}</div>`;}
function trendOf(p){const sc=(p.games||[]).map(x=>+x.score||0);if(sc.length<2)return 0;const m=a=>a.reduce((s,x)=>s+x,0)/(a.length||1);const last=sc.slice(-3),prev=sc.slice(-6,-3);if(!prev.length)return 1;const d=m(last)-m(prev);return d>2?1:(d<-2?-1:0)}
function disp(p){const e=eff(p),ps=pstats(p),target=p.target!=null?+p.target:150;
  const games=(p.lgM||0)+ps.n,best=Math.max(p.lgHigh||0,ps.high),strikes=ps.strk+(p.lgStr||0),spares=ps.spr;
  return{no:p.no,name:p.name,firm:p.firm,g:p.g,team:p.team,role:p.role,initials:initials(p.name),
    avg:e.avg,target,best,games,strikes,spares,base:p.pt,gap:e.avg==null?target:target-e.avg,
    trend:trendOf(p),needs:games<3,avail:p.available!==false,recent:(p.games||[]).map(x=>+x.score||0).slice(-6),
    isMe:p.no===ui.me}}
function arrow(t){return t>0?"▲":(t<0?"▼":"▬")}
function arrowCol(t){return t>0?"var(--good)":(t<0?"var(--bad)":"var(--muted)")}

/* ============ OPTIMIZER (unit-tested engine) ============ */
function teamAvg(p){const e=eff(p);return e.avg==null?(settings.defaultAvg||100):e.avg}
function sumBase(L){return L.reduce((s,p)=>s+(p.pt||0),0)}
function sumAvg(L){return L.reduce((s,p)=>s+teamAvg(p),0)}
function isLead(p){return p&&[LEADS.A,LEADS.B,LEADS.C].includes(p.no)}
function priOrder(){const pt=settings.powerTeam||"A";return[pt,...["A","B","C"].filter(k=>k!==pt)]}
function overflowOf(t,cap){return["A","B","C"].reduce((s,k)=>s+Math.max(0,sumBase(t[k])-cap),0)}
function splitScore(t,cap,st){const of=overflowOf(t,cap),tot=["A","B","C"].map(k=>sumAvg(t[k]));let sh;
  if(st==="balanced")sh=Math.max(...tot)-Math.min(...tot);
  else if(st==="tiered"){const o=priOrder();sh=-(3*sumAvg(t[o[0]])+2*sumAvg(t[o[1]])+1*sumAvg(t[o[2]]))}
  else sh=-sumAvg(t[settings.powerTeam||"A"]);return of*1e6+sh}
function improveSplit(t,cap,st){const KS=["A","B","C"];let g=0;restart:while(g++<400){const bk=splitScore(t,cap,st);
  for(const k1 of KS)for(const k2 of KS){if(k1>=k2)continue;
    for(let i=0;i<t[k1].length;i++){const p1=t[k1][i];if(p1.g!=="M"||isLead(p1)||p1.pin)continue;
      for(let j=0;j<t[k2].length;j++){const p2=t[k2][j];if(p2.g!=="M"||isLead(p2)||p2.pin)continue;
        t[k1][i]=p2;t[k2][j]=p1;if(splitScore(t,cap,st)<bk-1e-9)continue restart;t[k1][i]=p1;t[k2][j]=p2;}}}
  break}return t}
function permMaps(items,keys){const r=[];(function go(i,u,a){if(i===items.length){r.push(a.slice());return}for(let j=0;j<keys.length;j++){if(u[j])continue;u[j]=1;a.push([items[i],keys[j]]);go(i+1,u,a);a.pop();u[j]=0}})(0,[],[]);return r.length?r:[[]]}
function buildTeams(st){st=st||settings.splitStrategy||"powerhouse";const cap=settings.capCr||25,KS=["A","B","C"];
  const base={A:[P(LEADS.A)],B:[P(LEADS.B)],C:[P(LEADS.C)]},placed=new Set([LEADS.A,LEADS.B,LEADS.C]);
  players.forEach(p=>{if(p.pin&&!placed.has(p.no)&&KS.includes(p.team)&&base[p.team].length<5){base[p.team].push(p);placed.add(p.no)}});
  const femLeft=players.filter(p=>p.g==="F"&&!placed.has(p.no)),maleLeft=players.filter(p=>p.g==="M"&&!placed.has(p.no)).sort((a,b)=>teamAvg(b)-teamAvg(a));
  const femNeed=KS.filter(k=>base[k].filter(p=>p.g==="F").length===0),order=priOrder(),pref=k=>st==="balanced"?0:order.indexOf(k);
  const maps=femLeft.length===femNeed.length?permMaps(femLeft,femNeed):[femLeft.map((p,i)=>[p,femNeed[i%Math.max(1,femNeed.length)]])];
  let best=null;
  for(const fm of maps){const t={A:[...base.A],B:[...base.B],C:[...base.C]};fm.forEach(([p,k])=>{if(k&&t[k].length<5)t[k].push(p)});
    for(const m of maleLeft){let c=KS.filter(k=>t[k].length<5&&sumBase(t[k])+m.pt<=cap);if(!c.length)c=KS.filter(k=>t[k].length<5);if(!c.length)break;
      const pick=st==="balanced"?c.sort((x,y)=>sumAvg(t[x])-sumAvg(t[y]))[0]:c.sort((x,y)=>pref(x)-pref(y)||sumBase(t[x])-sumBase(t[y]))[0];t[pick].push(m)}
    improveSplit(t,cap,st);const k=splitScore(t,cap,st);if(!best||k<best.k)best={t:{A:[...t.A],B:[...t.B],C:[...t.C]},k}}
  return best?best.t:base}
function currentTeams(){const t={A:[],B:[],C:[],U:[]};players.forEach(p=>{(["A","B","C"].includes(p.team)?t[p.team]:t.U).push(p)});return t}
function teamsForDisplay(){const c=currentTeams();if(c.A.length+c.B.length+c.C.length<15)return buildTeams(S.strategy);return{A:c.A,B:c.B,C:c.C}}

   The real ten-pin math lives in app-core.js (frameState/frameComplete/rollTxt)

/* ============ GUIDANCE (game plan) ============ */
function guidance(p){const g=p.games||[],n=g.length,e=eff(p),avg=e.avg,target=p.target!=null?+p.target:150;
  const ps=pstats(p),spg=n?ps.strk/n:0;
  const teamStrk=avgTeamStrikesPerGame();
  if(avg==null||n===0){return{head:avg==null?"Log your first game to unlock your plan":"Log a few games so we can build your plan",
    detail:"Record score, strikes and spares after each game — it takes 5 seconds and updates your ring.",chips:[]}}
  const gap=Math.round(target-avg);
  let head,detail;
  if(avg>=target){head="You're at your "+target+" target 🎯";detail="Now make "+target+" your floor — aim to clear it every game. Keep the same setup and pace."}
  else{head="Your next "+Math.min(gap,12)+" pins are in your strikes";detail="You're "+gap+" short of "+target+" — about "+Math.max(1,Math.ceil(gap/25))+" more strike"+(Math.ceil(gap/25)>1?"s":"")+" a game. Groove one repeatable first ball; never leave a single pin on the spare."}
  return{head,detail,chips:[{k:spg.toFixed(1)+" strikes/gm",gold:true},{k:"strikes break ties",gold:false},{k:"team "+teamStrk.toFixed(1)+"/gm",gold:false}]}}
function avgTeamStrikesPerGame(){let tot=0,gm=0;players.forEach(p=>{const ps=pstats(p);tot+=ps.strk;gm+=ps.n});return gm?tot/gm:0}

/* ============ SYNC / API ============ */
function setOnline(v){online=v}
async function apiGet(path){const r=await fetch(path);if(!r.ok)throw r;return r.json()}
/* Auth is session-only: the raw coach PIN is verified once by the server and
   never stored or sent again — only expiring, revocable session tokens travel. */
async function apiSend(m,path,body){const h={'Content-Type':'application/json'};const s=localStorage.getItem(SK);if(s)h['x-session']=s;const cs=localStorage.getItem(CSK);if(cs)h['x-coach-session']=cs;
  const r=await fetch(path,{method:m,headers:h,body:body?JSON.stringify(body):undefined});
  if(!r.ok){let msg='';try{msg=(await r.json()).error||''}catch(_){}
    const e=new Error(msg||('error '+r.status));e.status=r.status;e.auth=r.status===401;e.forbidden=r.status===403;e.locked=r.status===429;e.bad=r.status===400;e.server=r.status>=500;throw e}
  return r.json()}
/* /api/state now requires a session — use apiSend so the stored player/coach
   token travels; before sign-in this 401s and boot falls back to the cache. */
async function pull(){const d=await apiSend('GET','/api/state');merge(d);setOnline(true);cacheSave()}
async function coachAction(m,path,body,ok){try{const r=await apiSend(m,path,body);setOnline(true);ok&&ok(r);cacheSave()}
  catch(e){if(e&&e.auth){toast("Coach access needed","Unlock the cockpit first");openCoachPin()}else if(e&&e.forbidden){toast("Not allowed","That isn't yours to change")}else if(e&&(e.bad||e.locked)){toast("Rejected",e.message||'Invalid request')}else if(e&&e.server){toast("Not saved",e.message||'Server could not save — try again')}else{setOnline(false);toast("No server","Open your Coolify URL / localhost:3000 to save")}}}

/* ============ DURABLE OUTBOX (offline-safe score entry) ============ */
const outbox=createOutbox({storage:localStorage,key:OBK,send:e=>apiSend('POST','/api/games',{no:e.no,score:e.score,strikes:e.strikes,spares:e.spares,date:e.date,clientId:e.clientId})});
let _flushing=false;
/* only sync entries the current sign-in is allowed to write, so a different
   user on this device never spams 403s for someone else's queued scores */
function outboxMine(e){return ui.isCoach||+e.no===+ui.me}
async function flushOutbox(){if(_flushing||ui.me==null&&!ui.isCoach)return;if(!outbox.list().some(outboxMine))return;_flushing=true;
  try{const r=await outbox.flush(outboxMine);
    if(r.sent.length){setOnline(true);
      /* a queued game that just synced must not keep offering a "delete before sync" Undo */
      if(S._prevMe&&S._prevMe.queued&&r.sent.some(s=>s.entry.clientId===S._prevMe.clientId))S._prevMe=null;
      try{await pull()}catch(_){}
      toast("Synced",r.sent.length+" queued game"+(r.sent.length>1?"s":"")+" saved to the team");render()}
  }finally{_flushing=false}}

function optimizerViewHTML(){const t=teamsForDisplay(),cap=settings.capCr||25;
  const deltas={balanced:0,powerhouse:18,tiered:11};const delta=deltas[S.strategy]-deltas[S.applied];const showBanner=S.strategy!==S.applied;
  const cards=['A','B','C'].map(k=>{const L=t[k],base=sumBase(L),proj=Math.round(sumAvg(L)),lead=L.find(p=>p.role!=='P')||L[0];const tstr=teamStrikes(L),tspr=teamSpares(L);
    const chips=[...L].sort((a,b)=>teamAvg(b)-teamAvg(a)).map(p=>{const d=disp(p);return `<div style="display:flex;align-items:center;gap:6px;background:var(--app);border-radius:20px;padding:5px 10px 5px 5px"><div class="num" style="width:24px;height:24px;border-radius:50%;background:${avatarBg(d.g)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px">${d.initials}</div><span style="font-size:11.5px;font-weight:600;color:var(--navy)">${esc(shortName(d.name))}</span><span class="num" style="font-size:11px;font-weight:700;color:var(--muted)">${teamAvg(p)}</span></div>`}).join('');
    return `<div class="card" style="padding:15px;margin-top:12px"><div style="display:flex;align-items:center;gap:10px"><div class="num" style="width:32px;height:32px;border-radius:9px;background:var(--navy);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px">${k}</div><div style="flex:1"><div style="font-size:13px;font-weight:700;color:var(--navy)">Sub-team ${k}</div><div style="font-size:10.5px;color:var(--muted)">led by ${esc(shortName(lead.name))}</div></div><div style="text-align:right"><div class="num" style="font-size:18px;font-weight:700;color:var(--navy)">${proj}</div><div style="font-size:9.5px;color:var(--muted)">projected</div></div></div>
      <div style="display:flex;align-items:center;gap:9px;margin-top:11px"><div style="flex:1;height:6px;border-radius:3px;background:#ece7da;overflow:hidden"><div style="height:100%;border-radius:3px;width:${Math.min(100,base/cap*100)}%;background:${base>cap?'var(--bad)':'var(--good)'}"></div></div><div class="num" style="font-size:11px;font-weight:700;color:${base>cap?'var(--bad)':'var(--good)'}">${base.toFixed(1)} / ${cap} Cr</div></div>
      <div style="display:flex;gap:8px;margin-top:10px"><div style="flex:1;background:var(--app);border-radius:9px;padding:7px;text-align:center"><div class="num" style="font-size:14px;font-weight:700;color:var(--navy)">${tstr.toFixed(1)}</div><div style="font-size:8.5px;color:var(--muted)">strikes/gm ✕</div></div><div style="flex:1;background:var(--app);border-radius:9px;padding:7px;text-align:center"><div class="num" style="font-size:14px;font-weight:700;color:var(--navy)">${tspr.toFixed(1)}</div><div style="font-size:8.5px;color:var(--muted)">spares/gm /</div></div></div>
      <div style="display:flex;gap:5px;margin-top:10px;flex-wrap:wrap">${chips}</div></div>`}).join('');
  return `<div style="padding:16px 16px 100px">
    <div class="lbl" style="margin:2px 2px 8px">Split strategy</div>
    <div class="seg"><button class="${S.strategy==='balanced'?'on':''}" onclick="setStrategy('balanced')">Balanced</button><button class="${S.strategy==='powerhouse'?'on':''}" onclick="setStrategy('powerhouse')">Powerhouse</button><button class="${S.strategy==='tiered'?'on':''}" onclick="setStrategy('tiered')">Tiered</button></div>
    ${showBanner?`<div style="display:flex;align-items:center;gap:10px;background:var(--navy);border-radius:14px;padding:12px 14px;margin-top:12px;color:#fff"><div style="font-size:12.5px;flex:1">A stronger split is available — <span style="color:#7bd88f;font-weight:700">${delta>0?'+':''}${delta} projected pins</span></div><button onclick="applySplit()" style="background:var(--gold);color:var(--navy);border:none;border-radius:9px;padding:9px 13px;font-weight:700;font-size:12.5px;cursor:pointer">Apply</button></div>`:''}
    ${cards}
    <div style="text-align:center;font-size:11px;color:#968e7b;margin-top:14px;line-height:1.5">Captain + 2 vice-captains locked to separate sub-teams.<br>Each: 4 men + 1 woman · ≤ 25 Cr base.</div></div>`}
function mdEntry(team,no,game){return (matchday[team]||{})[no+'-'+game]||{}}
function matchDayViewHTML(){const team=S.mdTeam||'A';const c=currentTeams();let list=c[team];if(!list||!list.length)list=players.filter(p=>p.team===team);const md=matchday[team]||{};
  let series=0,tStr=0,tSpr=0,entered=0,fem=0;list.forEach(p=>{[1,2].forEach(g=>{const e=md[p.no+'-'+g];if(e){series+=e.score||0;tStr+=e.strikes||0;tSpr+=e.spares||0;entered++;if(p.g==='F')fem+=e.score||0}})});
  const teamChips=['A','B','C'].map(t=>`<button onclick="mdSetTeam('${t}')" class="chip ${t===team?'on':''}">Sub-team ${t}</button>`).join('');
  const col=(p,g)=>{const e=mdEntry(team,p.no,g);return `<div style="width:66px;flex:0 0 auto"><input inputmode="numeric" maxlength="3" value="${+e.score||''}" placeholder="—" onchange="setMatchScore('${team}',${p.no},${g},this.value)" class="num" style="width:100%;text-align:center;font-size:17px;font-weight:700;color:var(--navy);border:1px solid var(--line);border-radius:10px;padding:8px 4px;background:#fdfbf4"><div onclick="editCellSS('${team}',${p.no},${g})" style="text-align:center;font-size:9px;color:${(+e.strikes||+e.spares)?'#8a5a00':'#c6bfac'};margin-top:3px;cursor:pointer">${+e.score?((+e.strikes||0)+'✕ '+(+e.spares||0)+'/'):'✕ /'}</div></div>`};
  const rows=list.map(p=>`<div style="display:flex;align-items:center;gap:9px;background:#fdfbf4;border-radius:14px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)"><div class="num" style="width:34px;height:34px;border-radius:50%;background:${avatarBg(p.g)};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:0 0 auto">${initials(p.name)}</div><div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:700;color:var(--navy)">${esc(shortName(p.name))}${p.g==='F'?' <span style="font-size:8px;font-weight:800;background:#f4ecfa;color:#7d3c98;padding:1px 5px;border-radius:5px">♀</span>':''}</div><div style="font-size:9.5px;color:var(--muted)">2 qualifier games</div></div>${col(p,1)}${col(p,2)}</div>`).join('');
  return `<div style="padding:16px 16px 100px">
    <div style="background:linear-gradient(135deg,var(--navy),var(--navy2));border-radius:18px;padding:16px;color:#fff">
      <div style="font-size:15px;font-weight:700">Match day · Sub-team ${team}</div>
      <div style="font-size:11.5px;opacity:.72;margin-top:3px;line-height:1.4">Enter each player's 2 qualifier games. Tie-breakers: strikes → spares → female score.</div>
      <div style="display:flex;gap:6px;margin-top:12px">${teamChips}</div>
      <div style="display:flex;gap:7px;margin-top:14px">
        <div style="flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 6px;text-align:center"><div class="num" style="font-size:21px;font-weight:700;color:var(--gold2)">${series}</div><div style="font-size:8.5px;opacity:.6">series</div></div>
        <div style="flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 6px;text-align:center"><div class="num" style="font-size:21px;font-weight:700">${tStr}</div><div style="font-size:8.5px;opacity:.6">strikes ✕</div></div>
        <div style="flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 6px;text-align:center"><div class="num" style="font-size:21px;font-weight:700">${tSpr}</div><div style="font-size:8.5px;opacity:.6">spares /</div></div>
        <div style="flex:1;background:rgba(255,255,255,.1);border-radius:10px;padding:9px 6px;text-align:center"><div class="num" style="font-size:21px;font-weight:700">${entered}<span style="font-size:11px;opacity:.6">/10</span></div><div style="font-size:8.5px;opacity:.6">games</div></div></div>
      ${fem?`<div style="font-size:10.5px;opacity:.72;margin-top:10px">Female score (tie-breaker 3): <b style="color:var(--gold2)">${fem}</b></div>`:''}</div>
    <div style="display:flex;align-items:center;gap:8px;margin:16px 2px 8px"><div class="lbl">Player · game 1 · game 2</div><div style="font-size:10px;color:#968e7b;margin-left:auto">type score · tap ✕/ for strikes-spares</div></div>
    ${rows}
    <button onclick="shareMatchSummary('${team}')" style="width:100%;margin-top:6px;border-radius:12px;padding:12px;font-size:12.5px;font-weight:700;cursor:pointer;border:none;background:var(--gold);color:var(--navy)">Share Sub-team ${team} summary</button>
    <button onclick="clearMatchTeam('${team}')" style="width:100%;margin-top:8px;border-radius:12px;padding:10px;font-size:11.5px;font-weight:600;cursor:pointer;border:1px solid #f0d0cc;background:#fdeeec;color:var(--bad)">Clear Sub-team ${team} match scores</button>
    <div style="text-align:center;font-size:10.5px;color:#968e7b;margin-top:12px;line-height:1.5">Match scores are kept separate from practice — they never change anyone's practice average.</div></div>`}
function mdSetTeam(t){S.mdTeam=t;S._anim=true;render()}
function setMatchScore(team,no,game,val){const cur=mdEntry(team,no,game);let s=parseInt(String(val).replace(/[^\d]/g,''),10);if(isNaN(s))s=0;s=Math.max(0,Math.min(300,s));coachAction('POST','/api/matchday',{team,no,game,score:s,strikes:cur.strikes||0,spares:cur.spares||0},r=>{if(r&&r.matchday)matchday=r.matchday;cacheSave();render()})}
function editCellSS(team,no,game){const cur=mdEntry(team,no,game);const v=prompt("Strikes and spares for this game — e.g. 3,1",(cur.strikes||0)+","+(cur.spares||0));if(v==null)return;const parts=String(v).split(/[^\d]+/).filter(x=>x!=='');const st=Math.max(0,Math.min(12,parseInt(parts[0],10)||0)),sp=Math.max(0,Math.min(10,parseInt(parts[1],10)||0));coachAction('POST','/api/matchday',{team,no,game,score:cur.score||0,strikes:st,spares:sp},r=>{if(r&&r.matchday)matchday=r.matchday;cacheSave();render()})}
function clearMatchTeam(team){if(!confirm("Clear all match scores for Sub-team "+team+"? This can't be undone."))return;coachAction('POST','/api/matchday',{team,clear:true},r=>{if(r&&r.matchday)matchday=r.matchday;cacheSave();render();toast("Cleared","Sub-team "+team+" match scores removed")})}
function shareMatchSummary(team){const c=currentTeams();let list=c[team];if(!list||!list.length)list=players.filter(p=>p.team===team);const md=matchday[team]||{};let series=0,tStr=0,tSpr=0,entered=0,fem=0;list.forEach(p=>{[1,2].forEach(g=>{const e=md[p.no+'-'+g];if(e){series+=e.score||0;tStr+=e.strikes||0;tSpr+=e.spares||0;entered++;if(p.g==='F')fem+=e.score||0}})});const txt="🎳 VOX STARS · Sub-team "+team+" (match day)\nSeries: "+series+"  ("+entered+"/10 games)\nStrikes: "+tStr+"  ·  Spares: "+tSpr+"  ·  Female: "+fem;try{if(navigator.share){navigator.share({text:txt}).catch(()=>{})}else{window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")}}catch(e){try{window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank")}catch(_){}}toast("Summary ready","Share it with the team")}

/* ============ HELPERS for views ============ */
function shortName(n){return n.replace(/^(AR\.|ID\.|ER\.|Mr\.|Mrs\.|Ms\.)\s*/i,"").trim()}
function leadName(team){const l=players.find(p=>p.team===team&&p.role!=='P');return l?shortName(l.name).split(' ')[0]:'—'}
function teamRankAmongOurs(team){const t=currentTeams();const tots=['A','B','C'].map(k=>({k,v:sumAvg(t[k])})).sort((a,b)=>b.v-a.v);const i=tots.findIndex(x=>x.k===team);return ordinal(i+1)}
function ourBestSeries(){const t=teamsForDisplay();return Math.max(...['A','B','C'].map(k=>Math.round(sumAvg(t[k]))))}
function ladderRows(){const rivals=Object.keys(RIVAL_AVGS).map(n=>({n,pts:RIVAL_AVGS[n].slice(0,5).reduce((a,b)=>a+b,0),you:false}));
  rivals.push({n:'VOX STARS',pts:ourBestSeries(),you:true});rivals.sort((a,b)=>b.pts-a.pts);
  const voxRank=rivals.findIndex(x=>x.you)+1,max=rivals[0].pts||1;
  return{voxRank,list:rivals.slice(0,6).map((x,i)=>({...x,r:i+1,pct:Math.round(x.pts/max*100)}))}}
function strikeLeaderboard(){const arr=players.map(p=>({no:p.no,n:p.name,v:pstats(p).strk+(p.lgStr||0),you:p.no===ui.me})).sort((a,b)=>b.v-a.v);
  const myRank=arr.findIndex(x=>x.you)+1;return{myRank,list:arr.slice(0,5).map((x,i)=>({...x,rank:i+1}))}}
function ordinal(n){return n+ordinalSuf(n)}
function ordinalNum(n){return n}
function ordinalSuf(n){const s=["th","st","nd","rd"],v=n%100;return s[(v-20)%10]||s[v]||s[0]}

const AIKEY='vox_v3_aikey';
function extractScore(text){if(!text)return null;const nums=(String(text).match(/\d{1,3}/g)||[]).map(Number).filter(n=>n>=0&&n<=300);if(!nums.length)return null;return Math.max(...nums)}
function aiKeySet(){return !!((localStorage.getItem(AIKEY)||'').trim())}
function fileToB64(file){return new Promise((res,rej)=>{const rd=new FileReader();rd.onload=()=>res(String(rd.result).split(',')[1]);rd.onerror=rej;rd.readAsDataURL(file)})}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector('script[data-vs="'+src+'"]'))return res();const s=document.createElement('script');s.src=src;s.setAttribute('data-vs',src);s.onload=()=>res();s.onerror=()=>rej(new Error('load'));document.head.appendChild(s)})}
async function readWithTesseract(file){await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js");const url=URL.createObjectURL(file);try{const r=await Tesseract.recognize(url,'eng');return extractScore(r&&r.data&&r.data.text)}finally{URL.revokeObjectURL(url)}}
async function readWithGemini(file,key){const b64=await fileToB64(file);const body={contents:[{parts:[{text:"This is a photo of a ten-pin bowling scoreboard/monitor. Reply with ONLY the final total score as a single integer between 0 and 300. If you cannot read it, reply 0."},{inline_data:{mime_type:file.type||'image/jpeg',data:b64}}]}]};const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('vision');const d=await r.json();let txt='';try{txt=d.candidates[0].content.parts[0].text}catch(e){txt=''}return extractScore(txt)}
function snapMonitor(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)readPhoto(f)};inp.click()}
async function readPhoto(file){S.photoBusy=true;render();const key=(localStorage.getItem(AIKEY)||'').trim();let score=null;
  if(key){try{score=await readWithGemini(file,key)}catch(e){score=null}}
  if(score==null){try{score=await readWithTesseract(file)}catch(e){score=null}}
  S.photoBusy=false;
  if(score!=null&&score>0){setScoreInput(String(score));toast("Read "+score+" from the photo","Check it's right, then Save")}
  else{toast("Couldn't read it clearly","Type the score — your photo makes it quick")}
  render()}

function snapFrames(){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.onchange=e=>{const f=e.target.files&&e.target.files[0];if(f)readPhotoFrames(f)};inp.click()}
async function readFramesGemini(file,key){const b64=await fileToB64(file);const body={contents:[{parts:[{text:"This is a photo of ONE player's ten-pin bowling scoresheet with up to 10 frames. Return ONLY a JSON array of integers giving pins knocked down on each roll in order: 10 = strike; a spare's two rolls sum to 10; a miss/gutter is 0; the 10th frame may have up to 3 rolls. No prose. Example: [10,7,3,9,0,10]"},{inline_data:{mime_type:file.type||'image/jpeg',data:b64}}]}]};const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('vision');const d=await r.json();let txt='';try{txt=d.candidates[0].content.parts[0].text}catch(e){txt=''}const m=String(txt).match(/\[[^\]]*\]/);if(!m)return null;let arr;try{arr=JSON.parse(m[0])}catch(e){return null}if(!Array.isArray(arr))return null;arr=arr.map(x=>Math.max(0,Math.min(10,parseInt(x,10)||0))).slice(0,21);return arr.length?arr:null}
async function readPhotoFrames(file){S.photoBusy=true;render();const key=(localStorage.getItem(AIKEY)||'').trim();let rolls=null;

async function saveLog(){const e=S.entry;if(!(e.score>0)){toast("Enter a score","Tap ＋ or type a final score");return}
  const no=S.logTarget||ui.me,p=P(no),body={no,score:e.score,strikes:e.strikes,spares:e.spares,date:new Date().toISOString().slice(0,10),clientId:outbox.newClientId()};
  const wasBest=disp(p).best;
  try{const{game}=await apiSend('POST','/api/games',body);S._prevMe={no,game};p.games.push(game);cacheSave();setOnline(true);
    S.sheet=null;const nb=e.score>=wasBest;toast(nb?'New personal best! 🎳':'Game logged',e.score+' pins · avg now '+disp(p).avg);render()}
  catch(err){
    /* never claim "saved" unless it reached the server or is durably queued;
       on auth/validation errors the form stays open so the score isn't lost */
    if(err&&err.auth){toast("Session expired","Sign in again — your score is still on this form");return}
    if(err&&err.forbidden){toast("Not your game","You can only log your own — score kept on the form");return}
    if(err&&(err.bad||err.locked||err.server)){toast("Not saved",err.message||"Rejected — score kept on the form, try again");return}
    const q=outbox.add(body);setOnline(false);
    if(q.ok){S._prevMe={no,clientId:q.entry.clientId,queued:true};S.sheet=null;toast("⏳ Queued — not yet synced","Saves automatically when you're back online");render()}
    else{toast("NOT saved","Couldn't reach the server or queue on this device — keep this form open and retry")}}}
async function undoLog(){const u=S._prevMe;if(!u)return;
  if(u.queued){
    if(outbox.remove(u.clientId)){S._prevMe=null;clearTimeout(_tt);S.toast=null;render();toast("Removed","Queued game deleted before syncing");return}
    /* it already synced while the toast was up — Undo must delete it on the server, not lie */
    const p=P(u.no),g=p&&(p.games||[]).find(x=>x.clientId===u.clientId);
    if(g){try{await apiSend('DELETE','/api/games/'+u.no+'/'+g.id);if(p)p.games=p.games.filter(x=>x.id!==g.id);S._prevMe=null;cacheSave();clearTimeout(_tt);S.toast=null;render();toast("Undone","Game removed from the server");return}catch(e){}}
    S._prevMe=null;render();toast("Already synced","It saved before you tapped Undo — delete it from My games");return}
  /* the game reached the server: Undo is only real once the server confirms the delete */
  try{await apiSend('DELETE','/api/games/'+u.no+'/'+u.game.id);const p=P(u.no);if(p)p.games=p.games.filter(x=>x.id!==u.game.id);S._prevMe=null;cacheSave();clearTimeout(_tt);S.toast=null;render();toast("Undone","Game removed from the server")}
  catch(e){toast("Undo failed",(e&&e.message)||"It's still saved — delete it from My games when online")}}

async function delMyGame(id){
  if(!id||id==='undefined'){toast("Refresh needed","Syncing this game first — try delete again");try{await pull()}catch(_){}render();return}
  if(!confirm("Delete this game? This can't be undone."))return;const no=ui.me,p=P(no);
  try{const r=await apiSend('DELETE','/api/games/'+no+'/'+id);
    if(r&&r.removed>0){p.games=p.games.filter(x=>String(x.id)!==String(id));cacheSave();setOnline(true);toast("Game removed","Your average updated")}
    else{try{await pull()}catch(_){}toast("Already gone","Refreshed from the server")}
    render()}
  catch(e){if(e&&e.forbidden){toast("Not allowed","Only your own games")}else if(e&&e.auth){toast("Sign in again","")}else if(e&&e.server){toast("Not removed",e.message||"Server couldn't save — try again")}else{setOnline(false);toast("No server","Reconnect to remove")}}}
async function saveMyTarget(){const v=+($('#tgtIn')?$('#tgtIn').value:0)||null;const p=P(ui.me);
  try{await apiSend('POST','/api/mytarget',{no:ui.me,target:v});p.target=v;cacheSave();toast("Target set","Chasing "+(v||150)+" now")}
  catch(e){if(e&&e.auth){toast("Session expired","Sign in again to save")}else if(e&&e.status){toast("Not saved",e.message||"Try again")}else{setOnline(false);toast("No server","Reconnect to save your target")}}}
/* coach */
function enterCoachDirect(){ui.mode='coach';S.screen='app';S.ctab='squad';saveUI();S._anim=true;render();}
function openCoachPin(){const pin=prompt("Coach / Captain PIN");if(pin==null)return;
  /* the raw PIN is sent once for verification and never stored — we keep only
     the expiring coach session the server issues */
  apiSend('POST','/api/coach/verify',{pin:pin.trim()}).then(r=>{if(r.ok&&r.session){localStorage.setItem(CSK,r.session);ui.mode='coach';ui.isCoach=true;S.screen='app';S.ctab='squad';saveUI();S._anim=true;render();toast("Coach mode","Full access unlocked (session expires in ~12h)")}})
  .catch(e=>{if(e&&e.auth){toast("Wrong PIN","Ask for the captain PIN")}else if(e&&e.locked){toast("Too many attempts",e.message||"Wait a bit, then try again")}else{setOnline(false);toast("No server","Can't verify PIN offline")}})}
function toggleAvail(no){const p=P(no);const nv=!(p.available!==false);coachAction('PUT','/api/players/'+no,{available:nv},()=>{p.available=nv;render()})}
function nudge(no){const p=P(no),first=shortName(p.name).split(' ')[0];const msg="Hi "+first+"! Log your bowling practice scores in the VOX STARS app so we can build the best line-up — every game you log helps the team: "+location.origin;try{window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")}catch(e){}toast("Opening WhatsApp","Pick "+first+" to send the nudge")}
function logForThem(no){S.logTarget=no;S.sheet='log';S.scorer='quick';S.entry={score:0,strikes:0,spares:0};S.rolls=[];render()}
function setStrategy(x){S.strategy=x;coachAction('PUT','/api/settings',{splitStrategy:x},()=>{settings.splitStrategy=x});render()}
function applySplit(){const t=buildTeams(S.strategy);const a={};['A','B','C'].forEach(k=>t[k].forEach(p=>a[p.no]=k));
  coachAction('POST','/api/teams',{assignments:a},()=>{players.forEach(p=>p.team=a[p.no]||null);S.applied=S.strategy;render();toast("Split applied","Sub-teams updated for the whole team")})}
/* session */
function setLane(n){S.session.lane=n;render()}
function setSessTeam(t){S.session={...S.session,team:t,idx:0,scores:{}};render()}
function sessAdj(no,d){const sc={...S.session.scores};sc[no]=Math.max(0,Math.min(300,(sc[no]||0)+d));S.session.scores=sc;render()}
function setSessScoreInput(no,v){let n=parseInt(String(v).replace(/[^\d]/g,''),10);if(isNaN(n))n=0;S.session.scores={...S.session.scores,[no]:Math.max(0,Math.min(300,n))}}
function sessNext(){const c=currentTeams();let list=c[S.session.team];if(c.A.length+c.B.length+c.C.length===0)list=players;S.session.idx=Math.min(list.length,S.session.idx+1);render()}
function sessPrev(){S.session.idx=Math.max(0,S.session.idx-1);render()}
async function sessSaveAll(){const sc=S.session.scores,date=new Date().toISOString().slice(0,10);let ok=0;const failed={};let lastErr=null;
  /* one stable clientId per player for this lane, reused across retries so a lost
     response can never create a duplicate game when the coach taps Save again */
  const cids=S.session.cids||(S.session.cids={});
  for(const no of Object.keys(sc)){if(!(sc[no]>0))continue;
    const cid=cids[no]||(cids[no]=outbox.newClientId());
    try{const{game}=await apiSend('POST','/api/games',{no:+no,score:sc[no],date,clientId:cid});P(+no).games.push(game);ok++;delete cids[no]}
    catch(e){failed[no]=sc[no];lastErr=e}}
  cacheSave();const nFail=Object.keys(failed).length;
  S.session={...S.session,idx:0,scores:failed,cids};
  if(nFail){if(lastErr&&!lastErr.status)setOnline(false);
    toast("Partly saved",ok+" saved · "+nFail+" NOT saved — kept on the form, tap Save again")}
  else toast("Lane saved",ok+" scores logged for the squad");
  render()}

/* ============ SYNC LOOP ============ */
/* A background sync got a real 401 while we were signed in: the stored session
   expired or was revoked. Clean up and route to re-auth once, instead of
   silently showing stale data. Only acts inside the app (not the login screen,
   where an unauthenticated /api/state 401 is expected). Queued scores in the
   outbox are preserved for when the same user signs back in. */
function handleSessionExpired(){
  if(S.screen!=='app')return;
  localStorage.removeItem(SK);localStorage.removeItem(CSK);
  ui.me=null;ui.isCoach=false;ui.mode='player';
  S.screen='login';S.loginStep='signin';S.pickSel=(players[0]||{}).no;
  setOnline(false);render();
  toast("Session expired","Sign in again to continue");
}
async function refresh(){try{await flushOutbox()}catch(e){}try{await pull();setOnline(true);render()}catch(e){if(e&&e.auth)handleSessionExpired();else setOnline(false)}}


/* ============ BOOT ============ */
function startPoll(){setInterval(async()=>{if(S.sheet||document.querySelector('input:focus'))return;try{await flushOutbox()}catch(e){}try{await pull();setOnline(true);if(S.screen==='app')render()}catch(e){if(e&&e.auth)handleSessionExpired();else setOnline(false)}},20000);
  window.addEventListener('online',()=>{flushOutbox().catch(()=>{})});}
async function boot(){loadUI();seed();try{await pull()}catch(e){setOnline(false);cacheLoad()}
  S.strategy=settings.splitStrategy||'powerhouse';S.applied=settings.splitStrategy||'powerhouse';S.pickSel=players[0].no;
  const jt=new URLSearchParams(location.search).get('join');
  if(jt){try{const r=await apiGet('/api/join?t='+encodeURIComponent(jt));if(r&&r.ok){S.screen='login';S.loginStep='claim';S.claimToken=jt;S.claimNo=r.player.no;render();startPoll();return;}}catch(e){}}
  const sess=localStorage.getItem(SK);
  if(sess){try{const r=await apiSend('POST','/api/session',{session:sess});if(r&&r.ok&&r.no!=null){ui.me=r.no;ui.isCoach=!!r.isCoach;ui.mode='player';S.screen='app';S.ptab='me';S.ctab='squad';render();startPoll();flushOutbox().catch(()=>{});return;}}catch(e){if(e&&e.auth)localStorage.removeItem(SK)}}
  const csess=localStorage.getItem(CSK);
  if(csess){try{const r=await apiSend('POST','/api/session',{session:csess});if(r&&r.ok){ui.isCoach=true;ui.mode='coach';S.screen='app';S.ctab='squad';render();startPoll();return;}}catch(e){if(e&&e.auth)localStorage.removeItem(CSK)}}
  S.screen='login';S.loginStep='signin';render();startPoll();}
boot();
</script>
